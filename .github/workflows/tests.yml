name: CPU checks

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: quadpilot --help
      - name: Run asset-independent tests
        run: >-
          python -m unittest
          tests.unit.test_control_core
          tests.unit.test_gate_sampling
          tests.unit.test_hardware_readiness
          tests.unit.test_teaser_comparison
